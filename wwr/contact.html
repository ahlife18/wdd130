        </nav>

    <main>
        <h1>Contact Us</h1>

        <section>
            <h2>Our Information</h2>
            <address>
                <h2>NO:47 Greenland estate indistrial Avenue, Obada Oko Ogun State</h2>
                <p><a href="tel:+2348108491093">Call us</a></p>
                <p><a href="mailto:ahlife18@gmail.com">Email us</a></p>
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31676.217814451997!2d3.2720399091494152!3d7.064699548011962!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x103bb2d9d0bbc3b7%3A0xea289f47a46b7e8d!2sObada-Oko%2C%20Ogun%20State!5e0!3m2!1sen!2sng!4v1790798179783!5m2!1sen!2sng"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin" title="Map showing
                Ahlife Rafting Adventures in Obada Oko, Ogun State"></iframe>

            </address>

        </section>

        <section>
            <h2>Meet Our Guides</h2>
            <figure>
                <img src="images/emmanuel.jpg" alt="This is mr Emmanunuel Kolawole Our lead guide">
                <figcaption>Mr Emmanuel Kolawole, Lead Rafting Guide</figcaption>
            </figure>
            <figure>
                <img src="images/james.jpg" alt="Mr James Our first assistance Guide">
                <figcaption>Mr James John, Assistance Rafting Guide</figcaption>
            </figure>
            <figure>
                <img src="images/amanda.jpg" alt="Mrs Amanda Phepls Second assistance guide">
                <figcaption>Mrs Amanda Phelps, Assistance Rafting Guide</figcaption>
            </figure>
        </section>

        <section>
            <h2>Send Us a Message</h2>
            <form>
                <label for="visitor-name">Your name:</label>
                <input type="text" id="visitor-name" name="visitor-name" required>
                <label for="visitor-email">Your email:</label>
                <input type="email" id="visitor-email" name="visitor-email" required>

                <fieldset>
                    <legend>What is your message about?</legend>

                    <input type="radio" id="general" name="purpose" value="general" required>
                    <label for="general">General Inquiry</label>

                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>

                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </fieldset>
                <label for="user-message">Your message:</label>
                <textarea id="user-message" name="user-message" rows="5" required></textarea>
                <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                <button type="submit">Send Message</button>
            </form>

        </section>

    </main>
